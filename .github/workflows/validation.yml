name: validation

on: push

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redmine-version: [6.1-stable, 7.0-stable, master]
    steps:
      - name: Checkout Tracky
        uses: actions/checkout@v4

      - name: Cache gems
        uses: actions/cache@v3
        with:
          path: tmp/bundle
          key: gems-${{ hashFiles('PluginGemfile.lock') }}-${{ matrix.redmine-version }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1

      - name: Start MySQL
        run: sudo service mysql start

      - name: Setup Tracky
        run: bin/setup
        env:
          GITHUB_ACTIONS: true
          REDMINE_VERSION: ${{ matrix.redmine-version }}

      - name: Run linters
        if: matrix.redmine-version != 'master'
        run: rake lint

      - name: Run tests
        run: rake test
        env:
          GITHUB_ACTIONS: true

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always() # Always run even if the previous step fails
        with:
          report_paths: 'tmp/redmine/test/reports/TEST-*.xml'
